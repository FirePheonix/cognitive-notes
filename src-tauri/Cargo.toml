[package]
name = "vengeance-desktop"
version = "0.1.0"
description = "Lightweight desktop writing app"
authors = ["Vengeance"]
edition = "2021"

[lib]
name = "vengeance_desktop_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-fs = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
